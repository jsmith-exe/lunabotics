autonomy:
  ros__parameters:
    autonomy.update_rate_hz: 5.0 # Autonomy update / command publish rate

    # LOCALISATION (localised_autonomy_node only)
    localisation.global_frame: map
    localisation.base_frame: base_footprint
    localisation.max_pose_age_s: 1.0 # Stop autonomy if the pose is older than this

    # EXCAVATION TUNING
    # wheels
    excavation.drive_speed: 0.2
    excavation.drive_distance_m: 1.0
    excavation.drive_duration_s: 10.0 # timed_autonomy_node only, replaces drive_distance_m

    # actuators
    excavation.contact_position_m: 0.035 # Actuator position where bucket reaches regolith
    excavation.max_excavation_position_m: 0.03 # Maximum bucket lowering depth during excavation
    excavation.raised_position_m: 0.22 # Bucket position after excavation
    excavation.position_tolerance_m: 0.005 # Allowed actuator position error before continuing

    # drum bucket
    excavation.drum_spin_speed: 0.8
    excavation.drum_spin_direction: 1.0 # sign will determine what direction the drum spins

    # DEPOSITION TUNING
    # wheels
    deposition.drive_to_zone_speed: 0.2
    deposition.drive_to_zone_distance_m: 1.5
    deposition.drive_to_zone_duration_s: 15.0 # timed_autonomy_node only, replaces drive_to_zone_distance_m
    deposition.deposit_drive_speed: 0.1
    deposition.deposit_drive_distance_m: 1.5
    deposition.deposit_drive_duration_s: 15.0 # timed_autonomy_node only, replaces deposit_drive_distance_m

    # actuators
    deposition.max_height_position_m: 0.22 # Bucket height for depositing regolith
    deposition.normal_height_position_m: 0.22 # Bucket height after deposition
    deposition.position_tolerance_m: 0.005 # Allowed actuator position error before continuing

    # drum bucket
    deposition.drum_spin_speed: 0.4
    deposition.drum_spin_direction: -1.0