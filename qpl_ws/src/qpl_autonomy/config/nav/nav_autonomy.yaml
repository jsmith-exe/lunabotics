# Tuning for nav_autonomy_node (NAV_EXCAVATE / NAV_DEPOSIT / AUTO), started by qpl_nav.
# The blind autonomy node reads config/fsm_tuning.yaml instead.
nav_autonomy:
  ros__parameters:
    autonomy.update_rate_hz: 5.0 # Autonomy update / command publish rate

    # Drum lift positions: bigger = higher. Keep within the actuators' range in
    # diffdrive_canbus/hardware/can_config.yaml (25-225 mm), or they can never reach the
    # target and the sequence waits forever.

    # EXCAVATION TUNING (rover stands still: spin, lower, hold for dig_duration_s, raise, stop spinning)
    # actuators
    excavation.lowered_position_m: 0.03 # Bucket down in the regolith
    excavation.dig_duration_s: 10.0 # How long to hold the bucket down spinning; nothing reports when it's full
    excavation.raised_position_m: 0.22 # Bucket position after excavation
    excavation.position_tolerance_m: 0.005 # Allowed actuator position error before continuing

    # drum bucket
    excavation.drum_spin_speed: 0.8
    excavation.drum_spin_direction: 1.0 # sign will determine what direction the drum spins

    # DEPOSITION TUNING (rover stands still at the berm: bucket raised, spin, stop spinning)
    # actuators
    deposition.raised_position_m: 0.22 # Bucket height while dumping
    deposition.position_tolerance_m: 0.005 # Allowed actuator position error before continuing

    # drum bucket
    deposition.drum_spin_speed: 0.4
    deposition.drum_spin_direction: -1.0 # opposite to excavation, to dump
    deposition.dump_duration_s: 15.0 # How long to spin; nothing reports when the drum is empty

    # NAVIGATION
    # Map frame [x, y, yaw], US arena: origin at the arena's SW interior corner, the
    # AprilTag wall is y = 0. The rover stands still at each waypoint to dig or dump.
    navigation.excavation_waypoint: [6.0, 1.5, 0.0] # excavation zone (y 0-3), clear of the start zone
    navigation.deposition_waypoint: [8.14, 6.40, 1.5708] # berm centre (x 7.69-8.59, y 5.30-7.50), drum over the berm, facing along it
    navigation.goal_timeout_s: 180.0
    navigation.max_retries: 2 # Failed goals re-sent before giving up
    navigation.travel_lift_position_m: 0.22 # Bucket held here while navigating, so it doesn't plough the regolith
    # The dig/dump starts once within both of these of the waypoint. A small buffer so the
    # rover doesn't keep shuffling to correct itself; keep the yaw in line with Nav2's
    # yaw_goal_tolerance in qpl_rover/config/nav_params.yaml.
    navigation.arrival_radius_m: 0.25
    navigation.arrival_yaw_tolerance_rad: 0.3 # ~17 deg

    # BREADCRUMB / RECORDER MODE (RECORD_START / RECORD_WAYPOINT / RECORD_END, FOLLOW_TO_*)
    # Following uses Nav2's FollowBreadcrumbs controller (qpl_rover/config/nav_params.yaml),
    # which has NO obstacle avoidance: the recorded route is trusted as clear. It reuses
    # goal_timeout_s, max_retries, travel_lift_position_m and the arrival tolerances above.
    breadcrumb.file: "~/.ros/qpl_breadcrumb_path.yaml" # Saved on RECORD_END, loaded at startup
    breadcrumb.min_spacing_m: 0.3 # Waypoints closer than this to the previous one are skipped
    breadcrumb.path_spacing_m: 0.05 # Spacing of the dense path sent to the controller
    breadcrumb.max_pose_age_s: 0.5 # Refuse to record/follow if /odometry/global is older than this
    breadcrumb.controller_id: "FollowBreadcrumbs"
    breadcrumb.goal_checker_id: "goal_checker"
