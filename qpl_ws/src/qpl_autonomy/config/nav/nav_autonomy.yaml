# Tuning for nav_autonomy_node (NAV_EXCAVATE / NAV_DEPOSIT / AUTO), started by qpl_nav.
# The blind autonomy node reads config/fsm_tuning.yaml instead.
nav_autonomy:
  ros__parameters:
    autonomy.update_rate_hz: 5.0 # Autonomy update / command publish rate

    # Drum lift positions: bigger = higher. drum_command_interface clamps lift commands to the
    # actuators' range in diffdrive_canbus/hardware/can_config.yaml (32-218 mm). Keep these
    # inside it: one further than position_tolerance_m outside is never reached, and the
    # sequence waits forever.

    # EXCAVATION TUNING (rover stands still: spin, lower, hold for dig_duration_s, raise, stop spinning)
    # actuators
    excavation.lowered_position_m: 0.032 # Bucket down in the regolith
    excavation.dig_duration_s: 10.0 # How long to hold the bucket down spinning; nothing reports when it's full
    excavation.raised_position_m: 0.218 # Bucket position after excavation
    excavation.position_tolerance_m: 0.005 # Allowed actuator position error before continuing

    # drum bucket
    excavation.drum_spin_speed: 0.8
    excavation.drum_spin_direction: 1.0 # sign will determine what direction the drum spins

    # DEPOSITION TUNING (rover stands still at the berm: bucket raised, spin, stop spinning)
    # actuators
    deposition.raised_position_m: 0.218 # Bucket height while dumping
    deposition.position_tolerance_m: 0.005 # Allowed actuator position error before continuing

    # drum bucket
    deposition.drum_spin_speed: 0.4
    deposition.drum_spin_direction: -1.0 # opposite to excavation, to dump
    deposition.dump_duration_s: 15.0 # How long to spin; nothing reports when the drum is empty
    # AUTO: after a dump, reverse this far straight back (the way the rover drove in) before
    # heading for the next dig spot, so it has room to turn away from the east wall
    deposition.back_out_m: 1.0
    deposition.back_out_speed: 0.1 # m/s

    # NAVIGATION
    # Map frame, US arena: origin at the arena's SW interior corner, the AprilTag wall is y = 0.
    # Candidates are flattened [x, y, yaw, x, y, yaw, ...]; the rover stands still at one to dig
    # or dump. Each leg takes the next candidate whose footprint (+ candidate_clearance_m) has
    # no lethal cell in the global costmap, and switches if it becomes blocked on the way.
    # Dig spots: spread over the whole excavation zone (x 0-9.14, y 0-3.0), which includes the
    # start zone (rulebook section 6.2.1), so a cluster of obstacles can't block all of them. Every
    # footprint stays at least 0.8 m from the walls, so none is near a wall or in a corner, where
    # the rover gets stuck. The yaw is only used for the costmap check: the rover digs facing the
    # way it drove there, so it doesn't turn on the spot at the goal. Columns x 6.9 / 5.5 / 4.1 / 1.4 /
    # 2.7: nearest the berm first, and in each row the spot just north of the start last. Not
    # further east: from x 7.8 the cameras couldn't see the AprilTag to re-localise (4.6 m away at
    # 18 deg to its wall), and the map pose drifted ~0.5 m by the berm. The south
    # row (y 1.5) is used first so later trips to the north row (y 2.4) don't cross old pits.
    # Used in turn; a spot with a boulder or crater under it is skipped.
    navigation.excavation_candidates: [6.9, 1.5, 1.5708,
                                       5.5, 1.5, 1.5708,
                                       4.1, 1.5, 1.5708,
                                       1.4, 1.5, 1.5708,
                                       2.7, 1.5, 1.5708,
                                       6.9, 2.4, 1.5708,
                                       5.5, 2.4, 1.5708,
                                       4.1, 2.4, 1.5708,
                                       1.4, 2.4, 1.5708,
                                       2.7, 2.4, 1.5708]
    # Dump spot: one, on the berm (x 7.69-8.59, y 5.30-7.50) as the rules specify. The drum is
    # under the middle of the rover, so its centre sits on the berm facing north. The depth
    # filter ignores piles inside the berm (ignore_zones in
    # qpl_rover/config/depth_obstacle_filter.yaml), so earlier dumps don't block it.
    # x 8.0, not the berm's centre line (8.14): turning on the spot the corners sweep 0.82 m, and at
    # 8.14 the rear wheels hit the east wall. The drum is still 0.31 m inside the berm's west edge.
    navigation.deposition_candidates: [8.0, 6.40, 1.5708]
    # Dumps can go via a point this far short of the dump spot, then straight on. Off: the planner
    # keeps the whole footprint clear and dumps take any heading, so it isn't needed to arrive
    # lined up, and with a boulder 1 m south of the point (sim seed 3) its north heading made it
    # unreachable, as turning there swept the corners into the boulder.
    navigation.deposition_approach_m: 0.0
    # Within this of the approach point counts as passed, whatever the heading
    navigation.approach_radius_m: 0.4
    # Footprint half sizes as in nav_params.yaml, plus clearance for the candidate check
    navigation.footprint_half_length_m: 0.62
    navigation.footprint_half_width_m: 0.53
    navigation.candidate_clearance_m: 0.05
    # Blocked only with at least this many lethal cells (5 cm each) under it, so sensor specks
    # don't rule out every spot. With none clear, the least blocked one is used.
    navigation.candidate_min_lethal_cells: 4
    navigation.goal_timeout_s: 180.0
    navigation.max_retries: 3 # Failed goals re-sent before giving up (each after a short unstick move)
    # Before each retry, drive this far back (or forwards, if behind is blocked) to a pose with
    # nothing lethal under the footprint: touching an obstacle or a wall, Nav2 can't plan a first
    # move and its own recoveries refuse to move, so a plain retry fails at once.
    navigation.unstick_m: 0.4
    navigation.unstick_speed: 0.08 # m/s
    # Each leg (and each retry) goes via waypoints this far apart along the widest way round in the
    # global costmap (the planner takes the shortest way that fits, which in a cluster of craters
    # was often a gap the rover grazed or stuck in). Only when the route keeps at least
    # route_min_clearance_m from lethal cells (the centre; the body is 0.53 m wide each side),
    # otherwise straight to the candidate.
    # The route is always the widest available; this is only how narrow it may be before going
    # straight to the candidate instead: just over the body's 0.53 m half-width, as going straight
    # (the planner's shortest way) was worse than any route that fits.
    navigation.route_min_clearance_m: 0.55
    navigation.route_waypoint_spacing_m: 1.0
    navigation.travel_lift_position_m: 0.218 # Bucket held here while navigating, so it doesn't plough the regolith
    # The dig/dump starts once within this of the waypoint, whatever the heading (the drum is
    # under the middle of the rover). A small buffer so the rover doesn't keep shuffling.
    navigation.arrival_radius_m: 0.25
    # Within stall_radius_m but no 5 cm closer for stall_time_s, the dig/dump starts anyway:
    # Nav2 can shuffle near a goal by the berm for minutes.
    navigation.stall_radius_m: 0.40
    navigation.stall_time_s: 10.0

    # RE-LOCALISING (AUTO): after each dig the rover turns on the spot until the front (or rear)
    # camera faces the tag, waits for min_fixes and the global EKF agreeing, then drives to the
    # berm. Skipped when the tag is out of the cameras' range; stops turning if the next step
    # would put the footprint on an obstacle; gives up after timeout_s. Turns on the spot and
    # digging slip the skid-steer, and nothing corrects the pose by the berm (~8 m from the tag):
    # without this the sim's map pose was 0.4-0.6 m out there, enough to hit the east wall.
    relocalise.enabled: true
    relocalise.tag_xy: [3.32, 0.02] # the AprilTag in qpl_rover/config/arena/us.yaml
    # 0: always, when in range. A recent fix isn't enough: from ~4 m one was up to 0.3 m out.
    relocalise.max_fix_age_s: 0.0
    relocalise.min_fixes: 5 # fixes to collect standing still, so the EKF averages them
    relocalise.turn_speed: 0.4 # rad/s
    relocalise.heading_tolerance_rad: 0.15
    relocalise.timeout_s: 25.0
    # Only tried this close to the tag and this far off its wall (0.35 rad = 20 deg). In the sim
    # the front camera lost the tag past ~4 m at 30 deg to the wall, so the dig spots by the
    # berm (x 7.8, ~18 deg) are skipped. Check the real cameras' range at the practice run.
    relocalise.max_range_m: 4.4   # the dig spot at (6.9, 2.4) is 4.3 m away at 34 deg
    relocalise.min_angle_from_wall_rad: 0.35
    # The front camera, or the rear one when it's a smaller turn and the tag is within this. In the
    # sim the front camera got ~1 fix/s out to 5 m at any angle to the tag; the rear one none past
    # 2.5-3 m, or 2 m at 30 deg to the wall. Check both at the practice run.
    relocalise.rear_camera_max_range_m: 2.5
    # Only turned when nothing lethal is within this of the rover: the corners sweep 0.82 m, and
    # turning on the spot by a boulder after a dig the sim rover slid 0.45 m into it (the EKF
    # didn't see the slide, so the per-step check couldn't stop it)
    relocalise.turn_clearance_m: 1.25

    # LOCALISATION
    # NAV_EXCAVATE / NAV_DEPOSIT / AUTO are refused unless the rover is localised: an AprilTag
    # fix no older than max_fix_age_s, at most max_drive_since_fix_m driven since it, and the
    # global EKF within max_fix_disagreement_m (plus the distance driven) of it. Checked when a
    # command arrives, not during a run. In the start zone, turn in RC until a camera sees the tag.
    localisation.require_localised: true
    localisation.max_fix_age_s: 30.0
    localisation.max_drive_since_fix_m: 1.0
    localisation.max_fix_disagreement_m: 0.3
