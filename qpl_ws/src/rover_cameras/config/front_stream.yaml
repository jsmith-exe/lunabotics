# Stream encoder for the front (RealSense) colour camera. See docs/camera-encoder-node.md.
# bit_rate and vbv_buffer_ms can be changed live:  ros2 param set /depth_camera_front/stream_encoder bit_rate 2000000
/depth_camera_front/stream_encoder:
  ros__parameters:
    input_topic: /depth_camera_front/color/image_raw
    camera_info_topic: /depth_camera_front/color/camera_info
    output_topic: /depth_camera_front/color/stream
    output_reliability: best_effort

    width: 640
    height: 480
    max_fps: 15.0

    codec: libx264
    preset: superfast
    tune: zerolatency
    threads: 4
    bit_rate: 1300000   # ~1/3 of the 3.6 Mbit/s egress per camera; the rest is telemetry
    vbv_buffer_ms: 200
    keyframe_interval: 1.0
    av_options: ""
