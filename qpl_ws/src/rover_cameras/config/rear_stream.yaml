/depth_camera_rear/stream_encoder:
  ros__parameters:
    input_topic: /depth_camera_rear/color/image_raw
    camera_info_topic: /depth_camera_rear/color/camera_info
    output_topic: /depth_camera_rear/color/stream
    output_reliability: reliable

    width: 640
    height: 0
    max_fps: 15.0

    codec: libx264
    preset: superfast
    tune: zerolatency
    threads: 4
    bit_rate: 1300000
    vbv_buffer_ms: 200
    keyframe_interval: 0.5
    av_options: ""
