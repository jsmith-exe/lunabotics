ekf_global:
  ros__parameters:
    use_sim_time: false
    frequency: 30.0
    sensor_timeout: 0.2
    publish_tf: true
    print_diagnostics: true
    two_d_mode: true
    

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: map

    transform_time_offset: 0.0
    transform_timeout: 0.1

    # AprilTag poses carry the IMAGE timestamp, which lags by the capture +
    # detection latency. Without lag smoothing the filter drops any measurement
    # older than its own time, so tag corrections vanish exactly when the
    # system is under load. This buffers 1 s of history and rewinds instead.
    smooth_lagged_data: true
    history_length: 1.0

    # INPUT 1: body-frame velocities from RAW wheel odometry. Deliberately NOT
    # /odometry/filtered — see the note in ekf_global_params.yaml: the local
    # EKF's output stamps can lag under load and stale measurements are
    # silently dropped by this filter.
    #
    # Yaw rate stays TRUE here, deliberately, matching ekf_local_params_rover.yaml:
    # it is the loose dropout fallback (0.05 in my_controllers.yaml) behind imu0's
    # gyro (0.001, INPUT 3 below). The sim twin has this bit FALSE because there
    # the IMU is near-perfect and always present; on hardware the RealSense can
    # fail, and pose0's AprilTag yaw only exists while the board is in view, so
    # dropping wheel yaw would leave heading unobservable between tag fixes.
    odom0: /diff_cont/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false

    # INPUT 2: The "Truth" from AprilTags
    pose0: /apriltag/pose
    pose0_config: [true,  true,  false, # Fuse X, Y position
                   false, false, true,  # Fuse Yaw orientation
                   false, false, false,
                   false, false, false,
                   false, false, false]
    pose0_mahalanobis_distance: 3.0  # 3.0 is a standard starting point for strictness

    pose0_differential: false
    pose0_relative: false

    # INPUT 3: Yaw rate from the RealSense gyro.
    # Mirrors ekf_local. Without this the global filter takes yaw rate from the
    # wheels while the local one takes it from the IMU; on slip the two estimates
    # diverge and the whole discrepancy is dumped into map -> odom as a rotation
    # jump, which is the artifact enabling the IMU was meant to remove.
    imu0: /camera/camera/imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,    # vyaw
                  false, false, false]

    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true