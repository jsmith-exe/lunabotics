controller_manager:
  ros__parameters:
    update_rate: 100

    drum_lift_cont:
      type: position_controllers/JointGroupPositionController

    drum_cont:
      type: velocity_controllers/JointGroupVelocityController

    diff_cont:
      type: diff_drive_controller/DiffDriveController 

    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster

diff_cont:
  ros__parameters:

    publish_rate: 100.0
    base_frame_id: base_footprint
    publish_tf: false

    left_wheel_names:  ["front_left_wheel_joint", "rear_left_wheel_joint"]
    right_wheel_names: ["front_right_wheel_joint", "rear_right_wheel_joint"]

    # TODO(calibration): wrong - 0.5836 is the chassis width, not the effective
    # skid-steer track. Measure as (v_right - v_left) / yaw_rate while spinning
    # in place, on the competition surface. Expect >= 0.895.
    wheel_separation: 0.5836
    wheel_radius: 0.15   # TODO(calibration): verify against loaded wheels on the real rover

    use_stamped_vel: false

    odom_frame_id: odom
    enable_odom_tf: false

    # [vx, vy, vz, vroll, vpitch, vyaw]; unfused axes get 1e6. Must not be left
    # at the default zeros, which robot_localization reads as near-perfect.
    # vy stays loose or it outvotes visual odometry's vy.
    # TODO(calibration): refine from real bag data on the competition surface.
    pose_covariance_diagonal:  [0.05, 0.05, 1.0e6, 1.0e6, 1.0e6, 0.1]
    twist_covariance_diagonal: [0.01, 0.05, 1.0e6, 1.0e6, 1.0e6, 0.05]

    linear:
      x:
        has_velocity_limits: true
        max_velocity: 1.0
        has_acceleration_limits: false

    angular:
      z:
        has_velocity_limits: true
        max_velocity: 1.0
        has_acceleration_limits: false

drum_lift_cont:
  ros__parameters:
    joints:
      - left_linear_actuator_joint
      - right_linear_actuator_joint

drum_cont:
  ros__parameters:
    joints:
      - drum_spin_joint
