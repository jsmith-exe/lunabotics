controller_manager:
  ros__parameters:
    update_rate: 100

    drum_lift_cont:
      type: position_controllers/JointGroupPositionController

    drum_cont:
      type: velocity_controllers/JointGroupVelocityController

    diff_cont:
      type: diff_drive_controller/DiffDriveController 

    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster

diff_cont:
  ros__parameters:

    publish_rate: 100.0
    base_frame_id: base_footprint
    publish_tf: false

    left_wheel_names:  ["front_left_wheel_joint", "rear_left_wheel_joint"]
    right_wheel_names: ["front_right_wheel_joint", "rear_right_wheel_joint"]

    # TODO(calibration): wheel_separation below is WRONG and needs measuring on
    # the real rover. 0.5836 is the chassis width, not wheel-centre to
    # wheel-centre, and this is a 4-wheel skid-steer on a 2-wheel diff-drive
    # model, so the effective track is larger still and surface-dependent.
    #
    # To calibrate: spin in place at a steady rate and compute
    # (v_right - v_left) / yaw_rate against an external yaw reference (IMU or
    # AprilTag). Repeat on the competition surface. Expect >= 0.895.
    # Do NOT copy the sim value from gaz_ros2_ctl_use_sim.yaml.
    wheel_separation: 0.5836
    wheel_radius: 0.15   # TODO(calibration): verify against loaded wheels on the real rover

    use_stamped_vel: false

    odom_frame_id: odom
    enable_odom_tf: false

    # ------------------------------------------------------------------
    # Odometry covariance
    # diff_drive_controller defaults both to all zeros, and zero is not
    # "unknown" - robot_localization substitutes ~1e-9, so the encoders get
    # fused as near-perfect and outvote every other input.
    #
    # Order is [vx, vy, vz, vroll, vpitch, vyaw]. Unfused axes get 1e6. vy must
    # stay loose: the diff-drive model reports a hard zero for it, and
    # tightening it would silently outvote visual odometry's vy.
    #
    # Applies in sim too - gazebo_ros2_control loads this file, and
    # gaz_ros2_ctl_use_sim.yaml overrides only wheel_separation.
    #
    # TODO(calibration): refine from real bag data on the competition surface.
    # These are starting values, not measured hardware ones.
    # ------------------------------------------------------------------
    pose_covariance_diagonal:  [0.05, 0.05, 1.0e6, 1.0e6, 1.0e6, 0.1]
    twist_covariance_diagonal: [0.01, 0.05, 1.0e6, 1.0e6, 1.0e6, 0.05]

    linear:
      x:
        has_velocity_limits: true
        max_velocity: 1.0
        has_acceleration_limits: false

    angular:
      z:
        has_velocity_limits: true
        max_velocity: 1.0
        has_acceleration_limits: false

drum_lift_cont:
  ros__parameters:
    joints:
      - left_linear_actuator_joint
      - right_linear_actuator_joint

drum_cont:
  ros__parameters:
    joints:
      - drum_spin_joint
