controller_manager:
  ros__parameters:
    update_rate: 100

    drum_lift_cont:
      type: position_controllers/JointGroupPositionController

    drum_cont:
      type: velocity_controllers/JointGroupVelocityController

    diff_cont:
      type: diff_drive_controller/DiffDriveController 

    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster

diff_cont:
  ros__parameters:

    publish_rate: 100.0
    base_frame_id: base_footprint
    publish_tf: false

    left_wheel_names:  ["front_left_wheel_joint", "rear_left_wheel_joint"]
    right_wheel_names: ["front_right_wheel_joint", "rear_right_wheel_joint"]

    wheel_separation: 0.5836
    wheel_radius: 0.15

    use_stamped_vel: false

    odom_frame_id: odom
    enable_odom_tf: false

    # robot_localization reads these straight off /diff_cont/odom. Left unset,
    # diff_drive_controller publishes all zeros and the EKF silently substitutes
    # a near-zero variance, i.e. treats wheel odometry as ground truth.
    # Order: [x, y, z, roll, pitch, yaw] and [vx, vy, vz, vroll, vpitch, vyaw].
    # Unfused axes get a large value; vyaw is deliberately loose because the IMU
    # is the primary heading source and this is only the dropout fallback.
    pose_covariance_diagonal:  [0.001, 0.001, 1000.0, 1000.0, 1000.0, 0.03]
    twist_covariance_diagonal: [0.001, 0.001, 1000.0, 1000.0, 1000.0, 0.05]

    linear:
      x:
        has_velocity_limits: true
        max_velocity: 1.0
        has_acceleration_limits: false

    angular:
      z:
        has_velocity_limits: true
        max_velocity: 1.0
        has_acceleration_limits: false

drum_lift_cont:
  ros__parameters:
    joints:
      - left_linear_actuator_joint
      - right_linear_actuator_joint

drum_cont:
  ros__parameters:
    joints:
      - drum_spin_joint
