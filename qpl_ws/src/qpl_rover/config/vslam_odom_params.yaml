# RGB-D visual odometry (SIM) — rtabmap_odom/rgbd_odometry
#
# Publishes a body-velocity estimate for the local EKF to fuse as odom1. No TF
# (the local EKF owns odom -> base_footprint) and no mapping.
#
# Hardware equivalent: vslam_odom_params_rover.yaml. Keep the two in sync
# except where the comments say otherwise.

/**:
  ros__parameters:
    use_sim_time: true

    # frame_id is the ROBOT frame. rtabmap resolves the camera pose from the
    # image header's frame_id via TF, so base_footprint -> <image frame_id>
    # must exist.
    frame_id: base_footprint
    odom_frame_id: odom

    # The local EKF publishes odom -> base_footprint; two writers would flap.
    publish_tf: false
    wait_for_transform: 0.2

    # In sim, colour and depth come from the same Gazebo depth sensor, so they
    # already share intrinsics and stamps.
    approx_sync: true
    approx_sync_max_interval: 0.03
    sync_queue_size: 10
    topic_queue_size: 10

    # Gazebo camera plugins publish RELIABLE.
    #
    # NB the image parameter is `qos`, NOT `qos_image` - an undeclared name here
    # is accepted silently and does nothing.
    qos: 1
    qos_camera_info: 1

    # Constrain the solution to x, y, yaw.
    Reg/Force3DoF: "true"

    # Seed each frame's feature search from the EKF's odom estimate. On
    # low-texture regolith this is the biggest robustness win available.
    guess_frame_id: odom
    Odom/GuessMotion: "true"

    Vis/MaxFeatures: "400"
    Vis/MinInliers: "8"
    Vis/InlierDistance: "0.10"
    Vis/EstimationType: "1"      # 3D->2D PnP; more robust with sparse depth
    Vis/CorGuessWinSize: "40"    # px search window when a guess is available

    # Stay silent when tracking is lost rather than emitting a null odometry
    # message, and re-initialise after 1 consecutive failure.
    publish_null_when_lost: false
    Odom/ResetCountdown: "1"
    Odom/FilteringStrategy: "0"
    Odom/FillInfoData: "true"
