arena:
  width: 4.4
  length: 7.9
  buffer: 0.20
  z_limit: 0.50

  apriltag: # map -> tag_0 transform used by localisation
    position: [ 0.02, 0.25, 0.25 ]
    quaternion: [ 0.0, 0.0, 1.0, 0.0 ]

  zones:
    - name: START
      x_min: 0.0
      x_max: 2.0
      y_min: 0.0
      y_max: 2.0

    - name: EXCAVATION
      x_min: 0.0
      x_max: 4.4
      y_min: 5.15
      y_max: 7.9

    - name: CONSTRUCTION
      x_min: 2.9
      x_max: 4.4
      y_min: 0.0
      y_max: 2.6

    - name: BERM
      x_min: 3.15
      x_max: 4.15
      y_min: 0.5
      y_max: 2.1