ekf_global:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.2
    publish_tf: true
    print_diagnostics: true
    two_d_mode: true
    

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: map

    transform_time_offset: 0.0
    transform_timeout: 0.1

    # AprilTag poses carry the image timestamp, so they arrive lagged.
    smooth_lagged_data: true
    history_length: 1.0

    # INPUT 1: body-frame velocities from raw wheel odometry. Not
    # /odometry/filtered - stale measurements are silently dropped by this
    # filter. Yaw rate off; imu0 below owns it.
    odom0: /diff_cont/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false

    # INPUT 3: IMU yaw rate. Rate only - absolute IMU yaw is arbitrary on
    # hardware and would fight the AprilTag yaw.
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true

    # INPUT 2: The "Truth" from AprilTags
    pose0: /apriltag/pose
    pose0_config: [true,  true,  false, # Fuse X, Y position
                   false, false, true,  # Fuse Yaw orientation
                   false, false, false,
                   false, false, false,
                   false, false, false]
    pose0_mahalanobis_distance: 3.0  # 3.0 is a standard starting point for strictness

    pose0_differential: false
    pose0_relative: false