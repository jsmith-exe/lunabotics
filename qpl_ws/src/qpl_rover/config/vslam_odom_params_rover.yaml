# RGB-D visual odometry (HARDWARE) — rtabmap_odom/rgbd_odometry
#
# Only the differences from vslam_odom_params.yaml are commented here.

/**:
  ros__parameters:
    use_sim_time: false

    frame_id: base_footprint
    odom_frame_id: odom

    publish_tf: false
    # Longer than sim: the TF chain may not have settled at bringup.
    wait_for_transform: 0.5

    approx_sync: true
    approx_sync_max_interval: 0.03
    sync_queue_size: 30
    topic_queue_size: 30

    # Best-effort: matches the RealSense driver either way. Wrong value fails
    # silently - the subscription never matches.
    qos: 2
    qos_camera_info: 2

    Reg/Force3DoF: "true"

    # See vslam_odom_params.yaml: no guess_frame_id, VO's own last motion
    # is the prior.
    Odom/GuessMotion: "true"

    # Profiled on the Jetson with the full stack running, rover stationary, 45 s runs.
    # Features are extracted at half resolution (640x400).
    Odom/ImageDecimation: "2"
    # Local bundle adjustment off. With it on, VO ran away: inliers fell below
    # Odom/VisKeyFrameThr (150), so every frame became a keyframe, the local map grew
    # and each frame cost more (195 -> 563 ms within 45 s, 4 -> 1.5 Hz). Off, it held
    # 54-61 ms (~11 Hz), ~179 inliers, no keyframes. Fallback if it drifts when driving:
    # Odom/Strategy "1" + Vis/CorType "1" (frame-to-frame, optical flow) held ~53 ms.
    OdomF2M/BundleAdjustment: "0"
    Vis/MaxFeatures: "300"
    Vis/MinInliers: "10"
    Vis/InlierDistance: "0.10"
    Vis/EstimationType: "1"
    Vis/CorGuessWinSize: "40"

    # Stay silent when lost; the EKF coasts on wheel odom + gyro.
    publish_null_when_lost: false
    Odom/ResetCountdown: "1"
    Odom/FilteringStrategy: "0"
    Odom/FillInfoData: "true"
