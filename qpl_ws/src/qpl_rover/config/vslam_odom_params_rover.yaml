# RGB-D visual odometry (HARDWARE) — rtabmap_odom/rgbd_odometry
#
# See vslam_odom_params.yaml for the full rationale; only the differences from
# the sim config are commented here.

/**:
  ros__parameters:
    use_sim_time: false

    frame_id: base_footprint
    odom_frame_id: odom

    publish_tf: false
    # Longer than sim: the RealSense driver and robot_state_publisher race at
    # bringup and the first frames can arrive before the TF chain settles.
    wait_for_transform: 0.5

    # ------------------------------------------------------------------
    # Sync
    # ------------------------------------------------------------------
    # On hardware the pair is colour + aligned_depth_to_color, which the
    # RealSense firmware registers into the colour frame. They are separate
    # streams with separate stamps, so approx_sync genuinely matters here.
    approx_sync: true
    approx_sync_max_interval: 0.03
    sync_queue_size: 30
    topic_queue_size: 30

    # Best-effort. A best-effort subscriber can receive from a RELIABLE
    # publisher, but not the reverse — so this is the setting that works
    # regardless of how the RealSense driver is configured. Getting this wrong
    # on hardware is silent: the subscription simply never matches and VO sits
    # there receiving nothing.
    #
    # NB the image parameter is `qos`, NOT `qos_image`. Verified against
    # `ros2 param list /visual_odometry`.
    qos: 2
    qos_camera_info: 2

    Reg/Force3DoF: "true"

    guess_frame_id: odom
    Odom/GuessMotion: "true"

    # ------------------------------------------------------------------
    # Visual odometry tuning
    # ------------------------------------------------------------------
    # Fewer features than sim. aligned_depth_to_color comes out at the COLOUR
    # resolution (1280x800 at default quality), and feature extraction at that
    # size is the dominant cost on the rover's compute. If VO can't keep frame
    # rate, launch the camera with use_low_quality:=true (424x240) before
    # touching these numbers.
    Vis/MaxFeatures: "300"
    Vis/MinInliers: "10"
    Vis/InlierDistance: "0.10"
    Vis/EstimationType: "1"
    Vis/CorGuessWinSize: "40"

    # (RGBD/LinearUpdate + RGBD/AngularUpdate deliberately absent — see the note
    # in vslam_odom_params.yaml: they are mapping params, inert here.)

    # ------------------------------------------------------------------
    # Loss behaviour
    # ------------------------------------------------------------------
    # Regolith is low-texture and the drum throws dust across the front camera.
    # Tracking WILL drop. Staying silent lets the EKF coast on wheel odom + gyro
    # until VO recovers, which is the correct degradation path.
    publish_null_when_lost: false
    Odom/ResetCountdown: "1"
    Odom/FilteringStrategy: "0"
    Odom/FillInfoData: "true"
