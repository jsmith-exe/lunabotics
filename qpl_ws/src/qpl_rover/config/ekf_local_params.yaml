ekf_local:
  ros__parameters:
    # ------------------------------------------------------------------
    # Core filter settings
    # ------------------------------------------------------------------
    use_sim_time: true
    publish_tf: true
    frequency: 50.0
    sensor_timeout: 0.1
    # Planar rover: nothing measures z/roll/pitch, so in 3D mode those states
    # are unobservable and their covariance grows without bound.
    two_d_mode: true

    # Local EKF:
    # - this filter publishes odom -> base_footprint
    # - a separate global source/filter should publish map -> odom
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Helpful while bringing the system up
    print_diagnostics: true
    debug: false

    # ------------------------------------------------------------------
    # IMU
    # Fuse yaw and yaw rate.
    # In two_d_mode, roll / pitch / z are constrained by the filter.
    #
    # Config order:
    # [x, y, z,
    #  roll, pitch, yaw,
    #  vx, vy, vz,
    #  vroll, vpitch, vyaw,
    #  ax, ay, az]
    # ------------------------------------------------------------------
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]

    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true

    # ------------------------------------------------------------------
    # Wheel odometry
    # Fuse body-frame velocities from wheel odom.
    # Keep pose disabled here to avoid double-using the same encoder source
    # if the odometry pose is derived from the same internal model.
    # ------------------------------------------------------------------
    # Yaw rate is DELIBERATELY off. Wheel yaw on a 4-wheel skid-steer is the
    # derived quantity (v_right - v_left) / wheel_separation, so it inherits the
    # wheel_radius error, the wheel_separation error, and all of the scrub — and
    # wheel_separation is surface-dependent, so no single value is ever right.
    #
    # Measured in sim against Gazebo ground truth on a 56 deg turn:
    #     wheel odom yaw error  +11.67 deg
    #     visual odom yaw error  -0.13 deg
    #     gyro-driven fused       0.00 deg
    # The gyro measures angular rate directly, with no kinematic model in the
    # way, so there is nothing for wheel yaw to add here. imu0 below owns it.
    odom0: /diff_cont/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]

    odom0_differential: false
    odom0_relative: false

    # ------------------------------------------------------------------
    # RGB-D visual odometry (vslam_launch.py)
    #
    # Body-frame velocities ONLY. Three reasons this is not the pose-fusing
    # config that was deleted in efad12f:
    #   1. VO pose drifts without bound in the odom frame, exactly like wheel
    #      odom does. Fusing both as absolute pose double-counts the same
    #      quantity and the two sources fight.
    #   2. odom -> base_footprint is a dead-reckoning edge by definition; the
    #      global EKF + AprilTags own absolute position via map -> odom.
    #   3. Yaw rate is deliberately left to the IMU. VO yaw is derived from the
    #      same feature matches as its translation, so it is not independent
    #      information, and it degrades first when texture is poor.
    #
    # The value here is vx/vy that don't care about wheel slip: when the wheels
    # spin up on regolith and over-report distance, this input contradicts them.
    # vy matters on a skid-steer — wheel odom reports it as a hard zero, so
    # lateral scrub during turns is otherwise invisible to the filter.
    #
    # Nothing breaks if vslam isn't running: robot_localization simply never
    # receives odom1 and carries on with odom0 + imu0.
    # ------------------------------------------------------------------
    odom1: /vo/odom
    odom1_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]

    odom1_differential: false
    odom1_relative: false
    odom1_queue_size: 10

    # VO failure mode is a large bogus jump, not gradual noise. publish_null_when_lost
    # is off so a lost tracker goes quiet rather than lying, and this catches
    # whatever slips through on recovery frames.
    odom1_twist_rejection_threshold: 3.0

    # ------------------------------------------------------------------
    # Optional timing settings
    # ------------------------------------------------------------------
    # transform_time_offset: 0.0
    # transform_timeout: 0.0