ekf_local:
  ros__parameters:
    # ------------------------------------------------------------------
    # Core filter settings
    # ------------------------------------------------------------------
    use_sim_time: false
    publish_tf: true
    frequency: 50.0
    sensor_timeout: 0.1
    # Planar rover: nothing measures z/roll/pitch, so in 3D mode those states
    # are unobservable and their covariance grows without bound.
    two_d_mode: true

    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    print_diagnostics: true
    debug: false

    # ------------------------------------------------------------------
    # IMU (RealSense gyro)
    # Yaw RATE only: the RealSense has no magnetometer, so any absolute yaw
    # is arbitrary at startup and drifts. Yaw rate is the trustworthy signal
    # and is immune to wheel slip.
    #
    # Subscribed direct to the driver rather than to imu_filter_madgwick's
    # /imu/data: the filter only overwrites `orientation`, which we do not
    # fuse, so routing through it would add a process to the critical path
    # for heading without changing a single fused value.
    #
    # NB /camera/camera/imu is deliberately NOT in the remap list in
    # camera_realsense.launch.py — see the note there before "tidying" it.
    #
    # TODO(calibration): wheel_separation is still uncalibrated on the real
    # rover (see the TODO in my_controllers.yaml). That error no longer reaches
    # heading now the gyro owns it, but it still scales odom0's vx/vy.
    #
    # Config order:
    # [x, y, z,
    #  roll, pitch, yaw,
    #  vx, vy, vz,
    #  vroll, vpitch, vyaw,
    #  ax, ay, az]
    # ------------------------------------------------------------------
    imu0: /camera/camera/imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,    # vyaw
                  false, false, false]

    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true

    # ------------------------------------------------------------------
    # Wheel odometry
    # Body-frame velocities only. vyaw stays enabled, but with a deliberately
    # loose twist_covariance_diagonal in my_controllers.yaml (0.05 vs the IMU's
    # 0.001) so the IMU dominates during slip while wheel odom still pins the
    # heading if the RealSense drops out. Removing it entirely would leave a
    # single non-redundant yaw source that fails open-loop and silently.
    #
    # This is the one place the hardware filter deliberately DIVERGES from the
    # sim one (ekf_local_params.yaml), where odom0 vyaw is false. In sim the IMU
    # is near-perfect and always present, so wheel yaw only adds its own +11.67
    # deg/56 deg scale error. On hardware the camera can fail, and a scaled yaw
    # beats no yaw.
    # ------------------------------------------------------------------
    odom0: /diff_cont/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,   # vx, vy
                   false, false, true,    # vyaw (loose fallback only)
                   false, false, false]

    odom0_differential: false
    odom0_relative: false

    # ------------------------------------------------------------------
    # RGB-D visual odometry (vslam_launch.py, hardware variant)
    #
    # Body-frame velocities only — see the long note in ekf_local_params.yaml
    # for why pose and yaw rate are deliberately excluded.
    #
    # Requires the RealSense to be publishing aligned_depth_to_color: that means
    # align_depth.enable in camera_realsense.launch.py (on) and realsense_launch
    # actually included in rover.launch.py (it now is). Opt in per run with
    # use_vslam:=true.
    #
    # Nothing breaks if vslam isn't running: this input simply never arrives.
    # ------------------------------------------------------------------
    odom1: /vo/odom
    odom1_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]

    odom1_differential: false
    odom1_relative: false
    odom1_queue_size: 10
    odom1_twist_rejection_threshold: 3.0
