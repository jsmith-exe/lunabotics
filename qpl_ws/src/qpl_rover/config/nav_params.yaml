  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    enable_groot_monitoring: false
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    # Reduce failure tolerance to force a costmap clear quicker when stuck
    failure_tolerance: 0.3 # Default is 0.5. Lower means faster recovery trigger.
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      # Turning in place counts as no progress, and the skid-steer only turns at about
      # 0.8x the commanded rate, so a 180 deg turn at max_vel_theta takes ~10 s.
      # 8.0 aborted turns partway through.
      movement_time_allowance: 30.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      # TOLERANCE NOTE: If robot oscillates at the goal, increase these slightly.
      xy_goal_tolerance: 0.20 # Tighten slightly if precision is needed, match with DWB
      # 0.20 (~11 deg) kept the skid-steer shuffling on the goal trying to line up; 0.3
      # (~17 deg) leaves a small buffer. nav_autonomy ignores heading except at the berm
      # approach point, and sends dig/dump goals facing the way the rover drives in.
      yaw_goal_tolerance: 0.3

    # RotationShim turns on the spot towards the path (and at the end to the goal heading)
    # and hands over to DWB once lined up. On its own DWB reversed for metres from an
    # arbitrary start heading (after a 360 in teleop, or the sim spawn facing the tag), and
    # crept round big heading changes at a few hundredths of a rad/s that the skid-steer
    # doesn't turn at. It checks the rotation against the local costmap before turning.
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "dwb_core::DWBLocalPlanner"
      # Turn on the spot when the path 1.0 m ahead is more than ~29 deg off, so the rover faces
      # where it's about to drive before driving there. The cameras see only +-0.51 rad: arcing
      # round a bend at speed, the front corner swept ground they hadn't seen and clipped a
      # boulder just outside the view (sim seed 11). 0.785 / 0.5 m let it arc into gentle bends.
      angular_dist_threshold: 0.5
      angular_disengage_threshold: 0.2  # until within ~11 deg, then DWB
      forward_sampling_distance: 1.0
      rotate_to_heading_angular_vel: 0.4  # max_vel_theta
      max_angular_accel: 0.8              # acc_lim_theta
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: true        # final heading turned on the spot, not shuffled to
      # Ramp from the last command, not the measured rate: the skid-steer doesn't start turning
      # at the first small step (0.08 rad/s), so closed loop never got past it and the rover
      # sat still until a recovery spin.
      closed_loop: false
      debug_trajectory_details: false

      ### VELOCITY LIMITS (Slowing it down) ##
      max_vel_x: 0.20       # Cut down from 0.4. Max forward speed is now 20 cm/s
      # Reverse at half forward speed. With 0.0 DWB never considered reversing, so a
      # dead end could only be escaped by the BackUp recovery. The rear camera feeds
      # the costmap, so it can see what's behind.
      min_vel_x: -0.10

      max_vel_y: 0.0        # Keep at 0.0 since rover is non-holonomic (differential)
      min_vel_y: 0.0

      max_vel_theta: 0.4    # Cut down from 0.8. Slows down how fast it spins in place
      min_speed_xy: 0.0
      max_speed_xy: 0.20    # Match max_vel_x
      min_speed_theta: 0.0

      ### ACCELERATION LIMITS (Smoother movements) ##
      # Lowering these stops the robot from jerking/snapping aggressively
      acc_lim_x: 0.4        # Down from 0.8
      acc_lim_y: 0.0
      acc_lim_theta: 0.8    # Down from 1.5

      decel_lim_x: -0.4     # Down from -0.8
      decel_lim_y: 0.0
      decel_lim_theta: -0.8 # Down from -1.5

      # Trajectory Sampling - Reduce if CPU utilization spikes:
      vx_samples: 12 # 10 -> 12 to keep resolution over the wider [-0.10, 0.20] range
      vy_samples: 1 # Keep at 1 for differential drive (no strafing)
      vtheta_samples: 12
      # How many seconds into the future the planner simulates. 1.5 s is only 0.3 m at
      # 0.2 m/s, too short to find a way around an obstacle, so DWB dithered in place.
      sim_time: 3.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.5
      xy_goal_tolerance: 0.20
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true

      # CRITIC TUNING NOTES:
      # High PathAlign/PathDist = strictly stays on global path.
      # High GoalAlign/GoalDist = rushes toward the goal shortcutting the path.
      # High ObstacleFootprint = keeps further from obstacles (collisions are rejected regardless).
      #
      # ObstacleFootprint, not BaseObstacle: BaseObstacle only scores the cell under the
      # rover's centre, so with the rectangular footprint DWB would drive a corner into a
      # wall while the centre was still in free space.
      critics:
        - RotateToGoal
        - Oscillation
        - ObstacleFootprint
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist
      # 0.05, not 25: any trajectory with part of the footprint within the 0.53 m inscribed
      # band of a wall scores 253 * scale. At 25 that outweighed every other critic, so the
      # rover wouldn't bring any edge within ~0.6 m of a wall and stalled short of goals near
      # them. Contact is still blocked: a footprint touching a lethal cell is rejected
      # outright whatever the scale. Nav2's default for this critic is 0.02.
      ObstacleFootprint.scale: 0.05
      # Follow the planner's path closely; the goal critics only pull at the end. Smac's lattice
      # paths already keep the whole footprint clear, but with path and goal weighted equally
      # DWB cut the corner round a crater towards the goal and clipped it (sim seed 7). PathAlign
      # stays the lightest, so a path the map pose has put over an obstacle doesn't fight
      # ObstacleFootprint.
      PathAlign.scale: 8.0
      PathAlign.forward_point_distance: 0.10
      GoalAlign.scale: 4.0
      GoalAlign.forward_point_distance: 0.10
      PathDist.scale: 24.0
      GoalDist.scale: 4.0
      RotateToGoal.scale: 20.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

      # Reverse makes forward/back dithering possible. The time reset matters most: a
      # boxed-in rover can't travel the reset distance, so it would stay latched.
      Oscillation.oscillation_reset_dist: 0.05
      Oscillation.oscillation_reset_angle: 0.2
      Oscillation.oscillation_reset_time: 3.0

# OBSTACLE NOTE (both costmaps):
# The depth clouds go through depth_obstacle_filter first (config/depth_obstacle_filter.yaml),
# which measures height above the floor in the IMU-levelled odom frame and publishes
# flattened obstacle/clearing clouds. All height decisions live there, so the height band
# below is wide on purpose, and sensor_frame is required because the clouds are in odom.
#
# FOOTPRINT NOTE: wheel outer edges are x +-0.58, y +-0.525 (rover_core.xacro), cameras at
# x +-0.61. A 0.70 m circle was narrower than the rover's diagonal and far wider than its sides.
# The footprint is a 0.62 x 0.53 half-size rectangle with 0.05 m rounded corners, so it sweeps
# 0.795 m when turning in place instead of 0.816 m. 0.05 m is the most rounding that still
# covers the wheels' outer corners; any more and the costmap would let the wheels hit walls.

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: "[[0.62, 0.48], [0.613, 0.505], [0.595, 0.523], [0.57, 0.53], [-0.57, 0.53], [-0.595, 0.523], [-0.613, 0.505], [-0.62, 0.48], [-0.62, -0.48], [-0.613, -0.505], [-0.595, -0.523], [-0.57, -0.53], [0.57, -0.53], [0.595, -0.523], [0.613, -0.505], [0.62, -0.48]]"
      # Wheels are the footprint's edges, and skid-steer slips on tight turns, so DWB gets 4 cm of
      # margin. Not more: obstacles are already grown by 0.12 m (depth_obstacle_filter.yaml), and
      # the way to the berm can be a ~1.4 m gap; at 0.10 sim seed 7 couldn't get through it.
      # Local costmap only.
      footprint_padding: 0.04
      transform_tolerance: 0.5
      always_send_full_costmap: true

      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        combination_method: 1
        observation_sources: front_marking front_clearing rear_marking rear_clearing

        front_marking:
          topic: /depth_camera_front/obstacles
          sensor_frame: camera_link_front
          data_type: "PointCloud2"
          marking: true
          clearing: false
          obstacle_max_range: 4.5   # the filter already stops at 4.0
          min_obstacle_height: -1.0
          max_obstacle_height: 2.0

        front_clearing:
          topic: /depth_camera_front/clearing
          sensor_frame: camera_link_front
          data_type: "PointCloud2"
          marking: false
          clearing: true
          raytrace_max_range: 5.5   # the filter already stops at 5.0
          min_obstacle_height: -1.0
          max_obstacle_height: 2.0

        rear_marking:
          topic: /depth_camera_rear/obstacles
          sensor_frame: camera_link_rear
          data_type: "PointCloud2"
          marking: true
          clearing: false
          obstacle_max_range: 4.5
          min_obstacle_height: -1.0
          max_obstacle_height: 2.0

        rear_clearing:
          topic: /depth_camera_rear/clearing
          sensor_frame: camera_link_rear
          data_type: "PointCloud2"
          marking: false
          clearing: true
          raytrace_max_range: 5.5
          min_obstacle_height: -1.0
          max_obstacle_height: 2.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # COST SCALING NOTE:
        # Lower = smoother/wider turns around corners.
        # Higher = tight, aggressive turns (closer to walls).
        # 3.0 -> 8.0: cost now falls off quickly past the rover's half-width, so paths can
        # run close to walls. 3.0 kept the rover too far off them to reach the excavation
        # zone along the south wall. Contact is still prevented by the footprint check.
        cost_scaling_factor: 8.0

        # INFLATION RADIUS NOTE:
        # Must be > the footprint's inscribed radius (0.53). The planner treats the rover
        # as a point, so this is what keeps its paths off the walls.
        # 0.75 -> 0.60: about 7 cm of soft margin beyond the rover's sides.
        inflation_radius: 0.60

  local_costmap_client:
    ros__parameters:
      use_sim_time: true

  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_footprint
      # Fixed map of the whole arena so walls persist once seen. map is the arena frame
      # (origin at the corner, from the AprilTag); this covers US (9.14 x 8.10) and UK
      # (4.4 x 7.9) with at least 0.36 m of margin. width/height must be whole metres.
      rolling_window: false
      origin_x: -0.5
      origin_y: -0.5
      width: 10
      height: 9
      resolution: 0.05
      footprint: "[[0.62, 0.48], [0.613, 0.505], [0.595, 0.523], [0.57, 0.53], [-0.57, 0.53], [-0.595, 0.523], [-0.613, 0.505], [-0.62, 0.48], [-0.62, -0.48], [-0.613, -0.505], [-0.595, -0.523], [-0.57, -0.53], [0.57, -0.53], [0.595, -0.523], [0.613, -0.505], [0.62, -0.48]]"
      # No footprint_padding: 0.10 (inscribed 0.63 m) was tried so NavFn would keep room to
      # turn, but obstacle marks are bigger than the obstacles (grown behind boulders, crater
      # shadows), so it closed a 1.25 m gap the rover drives through and sent it round into a
      # tight cluster of craters instead, where it stuck (sim seed 7, 3 runs).
      track_unknown_space: true
      transform_tolerance: 0.5
      always_send_full_costmap: true

      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        combination_method: 1
        observation_sources: front_marking front_clearing rear_marking rear_clearing

        front_marking:
          topic: /depth_camera_front/obstacles
          sensor_frame: camera_link_front
          data_type: "PointCloud2"
          marking: true
          clearing: false
          obstacle_max_range: 4.5
          min_obstacle_height: -1.0
          max_obstacle_height: 2.0

        front_clearing:
          topic: /depth_camera_front/clearing
          sensor_frame: camera_link_front
          data_type: "PointCloud2"
          marking: false
          clearing: true
          raytrace_max_range: 5.5
          min_obstacle_height: -1.0
          max_obstacle_height: 2.0

        rear_marking:
          topic: /depth_camera_rear/obstacles
          sensor_frame: camera_link_rear
          data_type: "PointCloud2"
          marking: true
          clearing: false
          obstacle_max_range: 4.5
          min_obstacle_height: -1.0
          max_obstacle_height: 2.0

        rear_clearing:
          topic: /depth_camera_rear/clearing
          sensor_frame: camera_link_rear
          data_type: "PointCloud2"
          marking: false
          clearing: true
          raytrace_max_range: 5.5
          min_obstacle_height: -1.0
          max_obstacle_height: 2.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Wider and softer than the local costmap. The planner treats the rover as a point
        # and only keeps its centre outside the inscribed radius, so with 0.60 / 8.0 its
        # shortest paths ran about 7 cm beside obstacles. Cost out to 1.1 m makes paths take
        # the middle of a gap when there is room. Narrow gaps are still planned through as
        # long as the footprint fits.
        cost_scaling_factor: 3.0
        inflation_radius: 1.1

  global_costmap_client:
    ros__parameters:
      use_sim_time: true

  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]

    # Smac lattice, not NavFn: NavFn plans the rover's centre point against the inscribed radius,
    # so it sent it into gaps the 1.06 m-wide footprint couldn't pass or turn in, and it wedged
    # there between craters and boulders in the sim. The lattice planner checks the whole
    # footprint at every pose, with diff-drive motion primitives (arcs, straights and turns on the
    # spot) at the costmap's 5 cm resolution. Needs the global inflation radius (1.1 m) to be past
    # the footprint's circumscribed radius (0.82 m).
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerLattice"
      lattice_filepath: "/opt/ros/humble/share/nav2_smac_planner/sample_primitives/5cm_resolution/0.5m_turning_radius/diff/output.json"
      allow_unknown: true            # the cameras haven't seen everything
      tolerance: 0.25                # m; if the goal itself is blocked, plan to within this of it
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0         # s; replanned every second by the behaviour tree
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      reverse_penalty: 2.0           # reversing allowed but discouraged
      change_penalty: 0.05
      non_straight_penalty: 1.05
      cost_penalty: 2.0              # stay in the middle of gaps (10 failed to plan often and was no better)
      rotation_penalty: 5.0          # turns on the spot slip the skid-steer; use them when needed
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      allow_reverse_expansion: true
      smooth_path: true

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    # Spin/BackUp distances, speeds and timeouts are set by the behavior tree
    # (behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml), not here.
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    # Spin's speed limits are read at this level on Humble; under spin: they were
    # ignored and recovery spins ran at the 1.0 rad/s default. Matches DWB.
    max_rotational_vel: 0.4
    min_rotational_vel: 0.2
    rotational_acc_lim: 0.8
    # Must be odom: Spin/BackUp collision-check against the local costmap, which is in
    # odom. With map they failed with "off grid" as soon as map -> odom had any
    # correction in it, i.e. exactly when the rover needed a recovery.
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.5

robot_state_publisher:
  ros__parameters:
    use_sim_time: true

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 10.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # SMOOTHER NOTE: Limits must be >= DWB Local Planner limits to prevent choking commands
    max_velocity: [0.8, 0.0, 0.8]
    # Wired in series by navigation_launch.py: /cmd_vel_nav_raw in, /cmd_vel_nav out.
    # x must allow DWB's reverse (min_vel_x).
    min_velocity: [-0.10, 0.0, -0.8]
    max_accel: [1.0, 0.0, 2.0]
    max_decel: [-1.0, 0.0, -2.0]
    odom_topic: /odometry/filtered
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names:
      - controller_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
