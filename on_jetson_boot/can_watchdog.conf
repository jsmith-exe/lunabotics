# Settings for can_watchdog.sh. Re-read every poll, so edits apply within 100 ms - no service restart needed.

# true: cycle can0 when its transmitter stalls. false: only watch (stalls are still logged, nothing is restarted).
ENABLED=true

# TX counter frozen with frames queued for this long counts as a stall.
STALL_MS=300

# Wait after a restart, so a bus with no other nodes (e.g. SPARK MAXes unpowered) is not cycled every STALL_MS.
COOLDOWN_S=1
